name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    env:
      # Mitigate intermittent crates.io download failures on CI runners
      # ("curl failed [16] Error in the HTTP2 framing layer"). Disabling
      # HTTP/2 multiplexing forces cargo's curl downloader back to HTTP/1.1,
      # which avoids the flaky HTTP2 framing-layer errors.
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_HTTP_CHECK_REVOKE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          WEBKIT_DEV_PKG="libwebkit2gtk-4.1-dev"
          if ! apt-cache show "$WEBKIT_DEV_PKG" >/dev/null 2>&1; then
            WEBKIT_DEV_PKG="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            desktop-file-utils \
            "$WEBKIT_DEV_PKG" \
            libappindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build pi extensions bundle
        run: bun run build:extensions

      # Raw (unbundled) release binary for Arch-style distros. `--no-bundle`
      # skips deb/rpm/AppImage packaging entirely; the standalone executable
      # lands at src-tauri/target/release/ompcot.
      - name: Build binary
        run: bunx tauri build --no-bundle

      - name: Package and upload portable bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN="src-tauri/target/release/ompcot"
          test -x "$BIN"
          case "${RUNNER_ARCH}" in
            X64) SUFFIX="x64" ;;
            ARM64) SUFFIX="arm64" ;;
            *) echo "Unexpected RUNNER_ARCH: ${RUNNER_ARCH}"; exit 1 ;;
          esac
          STAGE="ompcot-linux-${SUFFIX}"
          mkdir -p "${STAGE}/extensions"
          cp "$BIN" "${STAGE}/ompcot"
          cp -r public "${STAGE}/public"
          cp extensions/dist/embedded-server.mjs "${STAGE}/extensions/embedded-server.mjs"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          gh release create "${GITHUB_REF_NAME}" --generate-notes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "${STAGE}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
